<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>CHALOZKYSENSYSPRO // SENSI-SYS WEB</title>
  <style>
    :root {
      --bg: #06090F;
      --panel: #0C121D;
      --panel-alt: #121B2B;
      --cyan: #00F0FF;
      --green: #00FF88;
      --crimson: #FF2A55;
      --text: #E6F4F8;
      --muted: #7D92A1;
      --border: #1B2B3E;
    }
    * { box-sizing: border-box; font-family: monospace; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .box {
      max-width: 720px;
      margin: 0 auto 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    h1 { color: var(--cyan); margin: 0 0 6px; font-size: 18px; }
    .sub { color: var(--green); font-size: 12px; margin-bottom: 12px; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }
    .search-row input {
      margin-top: 0;
      flex: 1;
    }
    .btn-mini {
      width: auto;
      margin-top: 0;
      padding: 10px 14px;
      background: var(--panel-alt);
      color: var(--cyan);
      border: 1px solid var(--border);
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 10px 12px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
      font-size: 13px;
    }
    button {
      background: var(--cyan);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .stat {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
    }
    .stat span { display: block; color: var(--muted); font-size: 11px; }
    .stat strong { color: var(--green); font-size: 16px; }
    .hidden { display: none; }
    .err { color: var(--crimson); font-size: 12px; margin-top: 8px; }
    .no-match {
      background: var(--panel-alt);
      border: 1px dashed var(--crimson);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
      font-size: 12px;
    }
  </style>
</head>
